name: Actualizar perfil

on:
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:
  push:
    paths: ["generar.py", "arte.txt"]

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generar SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python generar.py
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add perfil.svg
          git diff --staged --quiet || git commit -m "Actualizar estadísticas del perfil"
          git push
